name: Build & Release

# Builds Mirrorly-Setup.exe (and the portable Mirrorly.exe) for a version tag like v1.0.0 and publishes
# a GitHub Release with them. "Tag release" (tag.yml) starts it after each merge into main; a tag pushed
# by hand starts it too. Started by hand on a branch (Actions tab → Build & Release → Run workflow), it
# only builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install the MinGW-w64 toolchain and NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nsis

      - name: Restore cached FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: deps/ffmpeg-win/install
          key: ffmpeg-n7.1-win64-${{ hashFiles('build_ffmpeg.sh') }}

      - name: Build FFmpeg (minimal, static)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ./build_ffmpeg.sh win

      - name: Download the Android USB tools (checksums verified)
        run: ./fetch_android_deps.sh

      - name: Build Mirrorly.exe and Mirrorly-Setup.exe
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          VERSION="$VERSION" REPO="$GITHUB_REPOSITORY" ./build_windows.sh
          VERSION="$VERSION" REPO="$GITHUB_REPOSITORY" ./build_installer.sh
          mkdir -p dist
          cp out/win/Mirrorly-Setup.exe out/win/Mirrorly.exe dist/
          # the app checks these before installing an update
          (cd dist && sha256sum Mirrorly-Setup.exe > Mirrorly-Setup.exe.sha256 && sha256sum Mirrorly.exe > Mirrorly.exe.sha256)

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Mirrorly-win64
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Mirrorly ${GITHUB_REF_NAME}

          Mirror your iPhone, iPad or Android phone to your Windows PC, with sound: over Wi-Fi (AirPlay) or with a USB cable.

          ### Download
          **Mirrorly-Setup.exe** below: run it, click **Install**, and Mirrorly opens. It installs for your
          Windows account only (no administrator rights) and keeps itself up to date.

          Prefer not to install? **Mirrorly.exe** is the portable version: run it from any folder.

          ### First run
          1. When Windows Defender Firewall asks, click **Allow** (tick *Private* and *Public*).
          2. Connect the iPhone and the PC to the same network.
          3. On the iPhone: **Control Center → Screen Mirroring →** choose your PC.

          Android (USB): turn on **USB debugging** on the phone (Developer options), plug it in and tap **Allow**.

          Windows 10/11, 64-bit. SHA-256 checksums: the \`.sha256\` files.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/Mirrorly-Setup.exe dist/Mirrorly-Setup.exe.sha256 \
            dist/Mirrorly.exe dist/Mirrorly.exe.sha256 \
            --title "Mirrorly ${GITHUB_REF_NAME}" --notes-file notes.md
